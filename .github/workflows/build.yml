name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux amd64
            deps: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev
            build: flet build linux --project rp_ds --module-name main_flet --output dist --yes
            outdir: dist/linux
          - os: ubuntu-24.04-arm
            label: Linux arm64
            deps: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev
            build: flet build linux --project rp_ds --module-name main_flet --output dist --yes
            outdir: dist/linux
          - os: windows-latest
            label: Windows amd64
            deps: ""
            build: flet build windows --project rp_ds --module-name main_flet --output dist --yes
            outdir: dist/windows
          - os: macos-13
            label: macOS amd64
            deps: ""
            build: flet build macos --project rp_ds --module-name main_flet --arch x64 --output dist --yes
            outdir: dist/macos
          - os: macos-latest
            label: macOS arm64
            deps: ""
            build: flet build macos --project rp_ds --module-name main_flet --arch arm64 --output dist --yes
            outdir: dist/macos
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: ${{ matrix.deps != '' }}
        run: ${{ matrix.deps }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.outdir }}/

  android:
    name: Android arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build APK
        run: flet build apk --project rp_ds --module-name main_flet --output dist --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android arm64 APK
          path: dist/apk/
