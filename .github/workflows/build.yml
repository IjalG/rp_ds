name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux amd64
            deps: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev
            build: flet build linux --project rp_ds --module-name main_flet --output dist --yes
          - os: ubuntu-24.04-arm
            label: Linux arm64
            deps: sudo apt-get update && sudo apt-get install -y libgtk-3-dev liblzma-dev
            build: flet build linux --project rp_ds --module-name main_flet --output dist --yes
          - os: windows-latest
            label: Windows amd64
            deps: ""
            build: flet build windows --project rp_ds --module-name main_flet --output dist --yes
          - os: macos-13
            label: macOS amd64
            deps: ""
            build: flet build macos --project rp_ds --module-name main_flet --arch x64 --output dist --yes
          - os: macos-latest
            label: macOS arm64
            deps: ""
            build: flet build macos --project rp_ds --module-name main_flet --arch arm64 --output dist --yes
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: ${{ matrix.deps != '' }}
        run: ${{ matrix.deps }}

      - name: Setup Flutter (arm64)
        if: matrix.label == 'Linux arm64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build
        env:
          FLET_CLI_NO_RICH_OUTPUT: true
        run: ${{ matrix.build }}

      - name: List output
        shell: bash
        run: |
          echo "=== dist/ (all) ==="
          find dist -maxdepth 3 2>/dev/null || echo "(no dist/)"
          echo "=== build/ (all) ==="
          find build -maxdepth 2 -type d 2>/dev/null || echo "(no build/)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  android:
    name: Android arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.x

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build APK
        run: flet build apk --project rp_ds --module-name main_flet --output dist --yes

      - name: List output
        shell: bash
        run: find dist -maxdepth 3 2>/dev/null || echo "(no dist/)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android arm64 APK
          path: dist/
          if-no-files-found: error
