name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux amd64
            build: flet build linux --project rp_ds --module-name main_flet --yes
            artifact: rp_ds-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            label: Linux arm64
            build: flet build linux --project rp_ds --module-name main_flet --yes
            artifact: rp_ds-linux-arm64.tar.gz
          - os: windows-latest
            label: Windows amd64
            build: flet build windows --project rp_ds --module-name main_flet --yes
            artifact: rp_ds-windows-amd64.zip
          - os: macos-13
            label: macOS amd64
            build: flet build macos --project rp_ds --module-name main_flet --arch x64 --yes
            artifact: rp_ds-macos-amd64.tar.gz
          - os: macos-latest
            label: macOS arm64
            build: flet build macos --project rp_ds --module-name main_flet --arch arm64 --yes
            artifact: rp_ds-macos-arm64.tar.gz
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build
        run: ${{ matrix.build }}

      - name: Package artifact
        shell: bash
        run: |
          shopt -s nullglob
          cd build/linux && tar czf ../../dist/${{ matrix.artifact }} . 2>/dev/null || true
          cd build/windows && 7z a ../../dist/${{ matrix.artifact }} . 2>/dev/null || true
          cd build/macos && tar czf ../../dist/${{ matrix.artifact }} . 2>/dev/null || true
          ls -la dist/ 2>/dev/null || echo "dist/ not found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  android:
    name: Android arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet textual httpx

      - name: Build APK
        run: flet build apk --project rp_ds --module-name main_flet --yes

      - uses: actions/upload-artifact@v4
        with:
          name: rp_ds-android-arm64.apk
          path: build/apk/*.apk
